<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Save transport test</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 2rem 1.25rem; color: #172327; background: #f6f8f7; }
    main { max-width: 34rem; margin: 3rem auto; }
    h1 { font-size: 1.7rem; }
    p { line-height: 1.6; overflow-wrap: anywhere; }
    button { padding: .85rem 1.1rem; border: 0; border-radius: .5rem; font: inherit; font-weight: 650; color: white; background: #174b3a; cursor: pointer; }
    button:focus-visible { outline: 3px solid #537bda; outline-offset: 4px; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { min-height: 1.6rem; }
  </style>
</head>
<body>
  <main>
    <h1>Save transport test</h1>
    <p>This submits one synthetic TEST response. Retrying from this page uses the same ID and exact answers. Reloading starts a new test.</p>
    <button id="submit" type="button">Submit one labeled transport test</button>
    <p id="request-id"></p>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script>
    'use strict';
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxkh8w6UPnsoEvkjj-IL6SMToL2B60lGnL1M_1XhzzO3vgayQjVvDt444uHnEEvC_GT/exec';
    const MAX_RESPONSE_BYTES = 2048;
    const button = document.getElementById('submit');
    const requestIdText = document.getElementById('request-id');
    const result = document.getElementById('result');
    let envelope = null;
    let serializedEnvelope = '';

    function createTestOnce() {
      if (envelope) return;
      envelope = Object.freeze({
        requestId: crypto.randomUUID(),
        responseName: 'TEST transport check',
        answers: Object.freeze({
          interest: 'interested', experience: 'Not yet',
          tools: Object.freeze([]), uses: Object.freeze([]), beliefs: Object.freeze([]),
          blockers: Object.freeze([]), example: 'TEST: synthetic transport verification.',
          question: 'TEST: retrying this exact request must not append a duplicate row.',
          availability: Object.freeze(['updates'])
        })
      });
      serializedEnvelope = JSON.stringify(envelope);
    }

    async function readAck(response) {
      if (!response.ok || !response.body) throw new Error('Unconfirmed');
      const reader = response.body.getReader();
      const chunks = [];
      let size = 0;
      try {
        while (true) {
          const next = await reader.read();
          if (next.done) break;
          size += next.value.byteLength;
          if (size > MAX_RESPONSE_BYTES) {
            await reader.cancel();
            throw new Error('Unconfirmed');
          }
          chunks.push(next.value);
        }
      } finally {
        reader.releaseLock();
      }
      const bytes = new Uint8Array(size);
      let offset = 0;
      for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
      const ack = JSON.parse(new TextDecoder('utf-8', {fatal: true}).decode(bytes));
      if (!ack || typeof ack !== 'object' || Array.isArray(ack) ||
          typeof ack.ok !== 'boolean' || ack.requestId !== envelope.requestId) {
        throw new Error('Unconfirmed');
      }
      return ack.ok;
    }

    button.addEventListener('click', async () => {
      if (button.disabled) return;
      button.disabled = true;
      result.textContent = 'Unconfirmed';
      let timeout;
      const controller = new AbortController();
      try {
        createTestOnce();
        requestIdText.textContent = 'Request ID: ' + envelope.requestId;
        const timedOut = new Promise((resolve, reject) => {
          timeout = setTimeout(() => {
            controller.abort();
            reject(new Error('Unconfirmed'));
          }, 20000);
        });
        const send = async () => {
          const response = await fetch(ENDPOINT, {
            method: 'POST', mode: 'cors', credentials: 'omit', redirect: 'follow',
            headers: {'Content-Type': 'text/plain;charset=UTF-8'},
            cache: 'no-store', referrerPolicy: 'no-referrer',
            body: serializedEnvelope, signal: controller.signal
          });
          return readAck(response);
        };
        const confirmed = await Promise.race([send(), timedOut]);
        result.textContent = confirmed === true ? 'Confirmed' : 'Unconfirmed';
      } catch {
        result.textContent = 'Unconfirmed';
      } finally {
        clearTimeout(timeout);
        button.disabled = false;
        if (envelope) button.textContent = 'Retry same test ID';
      }
    });
  </script>
</body>
</html>
